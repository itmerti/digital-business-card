<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>مهران اسداله پور | کارت ویزیت دیجیتال</title>
    <!-- Vazirmatn Font CDN -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@300;400;500;700;800&display=swap" rel="stylesheet">
    <!-- FontAwesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <style>
        :root {
            --bg-color: #0b0f19;
            --card-bg: rgba(23, 32, 54, 0.65);
            --card-border: rgba(0, 242, 254, 0.25);
            --accent-cyan: #00f2fe;
            --accent-blue: #4facfe;
            --text-primary: #ffffff;
            --text-secondary: #94a3b8;
            --btn-bg: rgba(255, 255, 255, 0.05);
            --btn-border: rgba(255, 255, 255, 0.12);
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Vazirmatn', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            background-color: var(--bg-color);
            background-image: 
                radial-gradient(at 0% 0%, rgba(79, 172, 254, 0.15) 0px, transparent 50%),
                radial-gradient(at 100% 100%, rgba(0, 242, 254, 0.12) 0px, transparent 50%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px 15px;
            color: var(--text-primary);
        }

        .container {
            width: 100%;
            max-width: 440px;
            background: var(--card-bg);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 1px solid var(--card-border);
            border-radius: 28px;
            padding: 35px 22px;
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5),
                        0 0 30px rgba(0, 242, 254, 0.1);
            text-align: center;
            position: relative;
            overflow: hidden;
        }

        .container::before {
            content: '';
            position: absolute;
            top: 0;
            left: -100%;
            width: 200%;
            height: 2px;
            background: linear-gradient(90deg, transparent, var(--accent-cyan), transparent);
            animation: borderGlow 4s infinite linear;
        }

        @keyframes borderGlow {
            0% { transform: translateX(0); }
            100% { transform: translateX(50%); }
        }

        /* Profile Header */
        .avatar-wrapper {
            position: relative;
            width: 110px;
            height: 110px;
            margin: 0 auto 18px;
        }

        .avatar {
            width: 100%;
            height: 100%;
            border-radius: 50%;
            object-fit: cover;
            border: 2px solid var(--accent-cyan);
            padding: 4px;
            background: rgba(0, 0, 0, 0.3);
            box-shadow: 0 0 20px rgba(0, 242, 254, 0.35);
        }

        .badge-status {
            position: absolute;
            bottom: 6px;
            right: 6px;
            width: 15px;
            height: 15px;
            background: #10b981;
            border-radius: 50%;
            border: 2px solid #0b0f19;
            box-shadow: 0 0 8px #10b981;
        }

        h1 {
            font-size: 1.45rem;
            font-weight: 800;
            letter-spacing: -0.5px;
            margin-bottom: 6px;
            background: linear-gradient(135deg, #ffffff 40%, var(--accent-cyan) 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .role {
            font-size: 0.92rem;
            color: var(--text-secondary);
            font-weight: 400;
            margin-bottom: 15px;
        }

        .bio {
            font-size: 0.85rem;
            line-height: 1.65;
            color: #cbd5e1;
            margin-bottom: 25px;
            padding: 0 5px;
        }

        /* 5 Quick Action Buttons in Single Row */
        .actions-single-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 8px;
            margin-bottom: 28px;
            background: rgba(0, 0, 0, 0.25);
            padding: 10px;
            border-radius: 18px;
            border: 1px solid rgba(255, 255, 255, 0.06);
        }

        .action-btn {
            flex: 1;
            height: 48px;
            display: flex;
            justify-content: center;
            align-items: center;
            background: var(--btn-bg);
            border: 1px solid var(--btn-border);
            border-radius: 12px;
            color: #ffffff;
            text-decoration: none;
            font-size: 1.15rem;
            cursor: pointer;
            transition: all 0.25s ease;
        }

        .action-btn:hover {
            transform: translateY(-3px);
            background: rgba(0, 242, 254, 0.15);
            border-color: var(--accent-cyan);
            color: var(--accent-cyan);
            box-shadow: 0 5px 15px rgba(0, 242, 254, 0.2);
        }

        .action-btn:active {
            transform: scale(0.95);
        }

        .action-btn.call:hover { color: #38ef7d; border-color: #38ef7d; }
        .action-btn.whatsapp:hover { color: #25d366; border-color: #25d366; }
        .action-btn.telegram:hover { color: #229ED9; border-color: #229ED9; }
        .action-btn.vcf:hover { color: #ffb703; border-color: #ffb703; }
        .action-btn.share:hover { color: var(--accent-cyan); border-color: var(--accent-cyan); }

        /* Secondary Links List */
        .links-list {
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .list-link-item {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 13px 18px;
            background: var(--btn-bg);
            border: 1px solid var(--btn-border);
            border-radius: 14px;
            color: #f8fafc;
            text-decoration: none;
            font-size: 0.92rem;
            font-weight: 500;
            transition: all 0.25s ease;
        }

        .list-link-item .icon-title {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .list-link-item i.brand-icon {
            font-size: 1.25rem;
            width: 24px;
            text-align: center;
            color: var(--accent-cyan);
        }

        .list-link-item .arrow-icon {
            font-size: 0.8rem;
            color: var(--text-secondary);
            transition: transform 0.2s;
        }

        .list-link-item:hover {
            background: rgba(255, 255, 255, 0.08);
            border-color: rgba(0, 242, 254, 0.4);
            transform: translateY(-2px);
        }

        .list-link-item:hover .arrow-icon {
            transform: translateX(-4px);
            color: var(--accent-cyan);
        }

        /* Footer */
        footer {
            margin-top: 25px;
            font-size: 0.75rem;
            color: var(--text-secondary);
            opacity: 0.7;
        }
    </style>
</head>
<body>

    <div class="container">
        <!-- Profile Header -->
        <div class="avatar-wrapper">
            <img src="mehran.jpg" alt="مهران اسداله پور" class="avatar" onerror="this.src='https://ui-avatars.com/api/?name=Mehran+Asadolahpour&background=00f2fe&color=0b0f19&size=200'">
            <div class="badge-status" title="در دسترس"></div>
        </div>

        <h1>مهران اسداله پور</h1>
        <div class="role">توسعه‌دهنده نرم‌افزار و کارشناس IT</div>
        <div class="bio">ارائه‌دهنده راهکارهای هوشمند نرم‌افزاری، مدیریت پروژه و سیستم‌های یکپارچه</div>

        <!-- 5 Action Buttons Row -->
        <div class="actions-single-row">
            <a href="tel:+989112527017" class="action-btn call" title="تماس تلفنی">
                <i class="fa-solid fa-phone"></i>
            </a>
            <a href="https://wa.me/989112527017" target="_blank" class="action-btn whatsapp" title="واتساپ">
                <i class="fa-brands fa-whatsapp"></i>
            </a>
            <a href="https://t.me/Mehran_Med" target="_blank" class="action-btn telegram" title="تلگرام">
                <i class="fa-brands fa-telegram"></i>
            </a>
            <button onclick="downloadVCF()" class="action-btn vcf" title="ذخیره مخاطب (VCF)">
                <i class="fa-solid fa-address-card"></i>
            </button>
            <button onclick="shareCard()" class="action-btn share" title="اشتراک‌گذاری">
                <i class="fa-solid fa-share-nodes"></i>
            </button>
        </div>

        <!-- Secondary Links (بدون گیت‌هاب و ایمیل مستقیم) -->
        <div class="links-list">
            <a href="https://medlina.ir" target="_blank" class="list-link-item">
                <div class="icon-title">
                    <i class="fa-solid fa-globe brand-icon"></i>
                    <span>وب‌سایت رسمی (Medlina)</span>
                </div>
                <i class="fa-solid fa-chevron-left arrow-icon"></i>
            </a>

            <a href="https://instagram.com" target="_blank" class="list-link-item">
                <div class="icon-title">
                    <i class="fa-brands fa-instagram brand-icon"></i>
                    <span>اینستاگرام</span>
                </div>
                <i class="fa-solid fa-chevron-left arrow-icon"></i>
            </a>

            <a href="https://linkedin.com" target="_blank" class="list-link-item">
                <div class="icon-title">
                    <i class="fa-brands fa-linkedin brand-icon"></i>
                    <span>لینکدین</span>
                </div>
                <i class="fa-solid fa-chevron-left arrow-icon"></i>
            </a>
        </div>

        <footer>
            طراحی اختصاصی | کارت ویزیت هوشمند
        </footer>
    </div>

    <!-- Logic for VCF & Web Share -->
    <script>
        function downloadVCF() {
            const vcard = `BEGIN:VCARD
VERSION:3.0
N:اسداله پور;مهران;;;
FN:مهران اسداله پور
ORG:Medlina
TITLE:Software Developer & IT Specialist
TEL;TYPE=CELL,VOICE:+989112527017
URL:https://medlina.ir
END:VCARD`;

            const blob = new Blob([vcard], { type: 'text/vcard;charset=utf-8;' });
            const url = URL.createObjectURL(blob);
            const newLink = document.createElement('a');
            newLink.download = 'Mehran_Asadolahpour.vcf';
            newLink.textContent = 'Mehran Asadolahpour';
            newLink.href = url;
            newLink.click();
            URL.revokeObjectURL(url);
        }

        async function shareCard() {
            if (navigator.share) {
                try {
                    await navigator.share({
                        title: 'مهران اسداله پور | کارت ویزیت هوشمند',
                        text: 'کارت ویزیت دیجیتال مهران اسداله پور (توسعه‌دهنده نرم‌افزار و IT)',
                        url: window.location.href
                    });
                } catch (err) {
                    console.log('اشتراک‌گذاری لغو شد');
                }
            } else {
                navigator.clipboard.writeText(window.location.href);
                alert('لینک کارت ویزیت در کلیپ‌بورد کپی شد!');
            }
        }
    </script>
</body>
</html>
