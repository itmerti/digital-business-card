<!doctype html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
  <meta name="theme-color" content="#0a0f1d">
  <meta name="description" content="کارت ویزیت دیجیتال مهران اسداله‌پور | توسعه‌دهنده نرم‌افزار، پایتون و اندروید">
  <title>مهران اسداله‌پور | کارت ویزیت دیجیتال</title>

  <!-- لود آنلاین و فوق‌العاده سریع فونت وزیرمتن -->
  <link rel="preconnect" href="https://cdn.jsdelivr.net">
  <link href="https://cdn.jsdelivr.net/gh/rastikerdar/vazirmatn@v33.003/Vazirmatn-font-face.css" rel="stylesheet" type="text/css" />

  <style>
    :root {
      color-scheme: dark;
      --bg-gradient: radial-gradient(circle at 10% 20%, #0d1b2a 0%, #070d18 90%);
      --card-bg: rgba(18, 26, 43, 0.75);
      --card-border: rgba(255, 255, 255, 0.12);
      --card-glow: 0 20px 50px rgba(0, 0, 0, 0.6), inset 0 1px 0 rgba(255, 255, 255, 0.15);
      
      --primary: #38bdf8;
      --primary-glow: rgba(56, 189, 248, 0.35);
      
      --text-main: #f8fafc;
      --text-muted: #94a3b8;
      --text-dim: #64748b;
      
      --btn-bg: rgba(255, 255, 255, 0.05);
      --btn-border: rgba(255, 255, 255, 0.08);
      
      /* رنگ‌های متمایز ۵ گانه */
      --c-call: #10b981;
      --c-wa: #25d366;
      --c-tg: #229ed9;
      --c-vcf: #f59e0b;
      --c-share: #a855f7;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      -webkit-tap-highlight-color: transparent;
      font-family: "Vazirmatn", -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }

    body {
      min-height: 100vh;
      background: var(--bg-gradient);
      color: var(--text-main);
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 24px 12px;
      overflow-x: hidden;
      position: relative;
    }

    /* حباب‌های نورانی امبینت پس‌زمینه */
    body::before, body::after {
      content: "";
      position: fixed;
      width: 320px;
      height: 320px;
      border-radius: 50%;
      filter: blur(100px);
      z-index: 0;
      pointer-events: none;
      opacity: 0.45;
    }
    body::before {
      background: #0284c7;
      top: -80px;
      left: -80px;
    }
    body::after {
      background: #6366f1;
      bottom: -80px;
      right: -80px;
    }

    .card-container {
      width: 100%;
      max-width: 460px;
      background: var(--card-bg);
      backdrop-filter: blur(24px);
      -webkit-backdrop-filter: blur(24px);
      border: 1px solid var(--card-border);
      border-radius: 28px;
      box-shadow: var(--card-glow);
      padding: 32px 18px 24px;
      position: relative;
      z-index: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      text-align: center;
      animation: cardAppear 0.7s cubic-bezier(0.16, 1, 0.3, 1) forwards;
    }

    @keyframes cardAppear {
      0% { opacity: 0; transform: translateY(20px) scale(0.98); }
      100% { opacity: 1; transform: translateY(0) scale(1); }
    }

    /* آواتار */
    .avatar-wrapper {
      position: relative;
      margin-bottom: 16px;
    }

    .avatar {
      width: 110px;
      height: 110px;
      border-radius: 50%;
      object-fit: cover;
      border: 3px solid rgba(255, 255, 255, 0.2);
      box-shadow: 0 10px 25px rgba(0, 0, 0, 0.5);
      background: #1e293b;
      display: block;
    }

    .status-badge {
      position: absolute;
      bottom: 4px;
      left: 6px;
      width: 16px;
      height: 16px;
      background: #10b981;
      border: 3px solid #0f172a;
      border-radius: 50%;
      box-shadow: 0 0 10px #10b981;
    }

    /* نام و عنوان */
    .name {
      font-size: 1.5rem;
      font-weight: 800;
      color: #ffffff;
      margin-bottom: 4px;
    }

    .title {
      font-size: 0.95rem;
      color: var(--primary);
      font-weight: 600;
      margin-bottom: 8px;
    }

    .bio {
      font-size: 0.84rem;
      color: var(--text-muted);
      line-height: 1.6;
      margin-bottom: 24px;
      max-width: 92%;
    }

    /* =========================================================
       🔥 ردیف اکشن ۵ تایی (حفظ کامل سایز قلم، بدون کم شدن عرض) 🔥
       ========================================================= */
    .actions-single-row {
      display: flex;
      justify-content: space-between;
      gap: 6px;
      width: 100%;
      margin-bottom: 24px;
      padding: 8px 6px;
      background: rgba(0, 0, 0, 0.28);
      border: 1px solid rgba(255, 255, 255, 0.06);
      border-radius: 20px;
    }

    .action-item {
      flex: 1;
      min-width: 0; /* جلوگیری از سرریز فلکس */
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 6px;
      text-decoration: none;
      background: var(--btn-bg);
      border: 1px solid var(--btn-border);
      border-radius: 14px;
      padding: 10px 4px 8px;
      color: var(--text-main);
      transition: all 0.25s cubic-bezier(0.4, 0, 0.2, 1);
      cursor: pointer;
      font-family: inherit;
    }

    /* آیکون داخل کادر */
    .action-item .action-icon {
      width: 20px;
      height: 20px;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
    }

    .action-item .action-icon svg {
      width: 100%;
      height: 100%;
      fill: currentColor;
      transition: transform 0.2s ease;
    }

    /* متن دکمه (حفظ سایز استاندارد و فونت بولد) */
    .action-item .action-text {
      font-size: 0.76rem; /* سایز خوانا بدون کوچک شدن */
      font-weight: 700;
      white-space: nowrap;
      line-height: 1;
    }

    /* تم اختصاصی هر دکمه */
    .btn-call { color: var(--c-call); }
    .btn-call:hover { background: rgba(16, 185, 129, 0.16); border-color: var(--c-call); box-shadow: 0 4px 15px rgba(16, 185, 129, 0.25); }

    .btn-wa { color: var(--c-wa); }
    .btn-wa:hover { background: rgba(37, 211, 102, 0.16); border-color: var(--c-wa); box-shadow: 0 4px 15px rgba(37, 211, 102, 0.25); }

    .btn-tg { color: var(--c-tg); }
    .btn-tg:hover { background: rgba(34, 158, 217, 0.16); border-color: var(--c-tg); box-shadow: 0 4px 15px rgba(34, 158, 217, 0.25); }

    .btn-vcf { color: var(--c-vcf); }
    .btn-vcf:hover { background: rgba(245, 158, 11, 0.16); border-color: var(--c-vcf); box-shadow: 0 4px 15px rgba(245, 158, 11, 0.25); }

    .btn-share { color: var(--c-share); }
    .btn-share:hover { background: rgba(168, 85, 247, 0.16); border-color: var(--c-share); box-shadow: 0 4px 15px rgba(168, 85, 247, 0.25); }

    .action-item:hover .action-icon svg {
      transform: scale(1.15) translateY(-1px);
    }
    .action-item:active {
      transform: scale(0.94);
    }

    /* خط تقسیم‌کننده */
    .divider {
      width: 100%;
      height: 1px;
      background: linear-gradient(90deg, transparent, rgba(255, 255, 255, 0.12), transparent);
      margin-bottom: 20px;
    }

    /* لیست کارت‌های پایینی */
    .links-list {
      width: 100%;
      display: flex;
      flex-direction: column;
      gap: 11px;
    }

    .link-card {
      display: flex;
      align-items: center;
      justify-content: space-between;
      background: var(--btn-bg);
      border: 1px solid var(--btn-border);
      padding: 13px 18px;
      border-radius: 16px;
      text-decoration: none;
      color: var(--text-main);
      transition: all 0.25s ease;
      font-size: 0.9rem;
    }

    .link-card:hover {
      background: rgba(255, 255, 255, 0.08);
      border-color: rgba(56, 189, 248, 0.4);
      transform: translateX(-3px);
    }

    .link-content {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .link-content svg {
      width: 21px;
      height: 21px;
      fill: var(--primary);
    }

    .link-arrow {
      opacity: 0.4;
      font-size: 1rem;
      transition: transform 0.2s;
    }

    .link-card:hover .link-arrow {
      opacity: 1;
      transform: translateX(-3px);
      color: var(--primary);
    }

    .footer {
      margin-top: 24px;
      font-size: 0.75rem;
      color: var(--text-dim);
    }

    /* پیام Toast */
    .toast {
      position: fixed;
      bottom: 24px;
      background: rgba(15, 23, 42, 0.95);
      backdrop-filter: blur(12px);
      border: 1px solid var(--primary);
      color: #fff;
      padding: 10px 22px;
      border-radius: 30px;
      font-size: 0.85rem;
      box-shadow: 0 10px 25px rgba(0,0,0,0.5);
      z-index: 100;
      opacity: 0;
      transform: translateY(20px);
      transition: all 0.3s cubic-bezier(0.16, 1, 0.3, 1);
      pointer-events: none;
    }
    .toast.show {
      opacity: 1;
      transform: translateY(0);
    }
  </style>
</head>
<body>

  <div class="card-container">
    
    <!-- تصویر آواتار مهران -->
    <div class="avatar-wrapper">
      <img src="mehran.jpg" onerror="this.src='https://api.dicebear.com/7.x/bottts/svg?seed=Mehran'" alt="مهران اسداله‌پور" class="avatar">

          <svg viewBox="0 0 24 24"><path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm4.64 6.8c-.15 1.58-.8 5.42-1.13 7.19-.14.75-.42 1-.68 1.03-.58.05-1.02-.38-1.58-.75-.88-.58-1.38-.94-2.23-1.5-.99-.65-.35-1.01.22-1.59.15-.15 2.71-2.48 2.76-2.69a.2.2 0 00-.05-.18c-.06-.05-.14-.03-.21-.02-.09.02-1.49.95-4.22 2.79-.4.27-.76.41-1.08.4-.36-.01-1.04-.2-1.55-.37-.63-.2-1.12-.31-1.08-.66.02-.18.27-.36.75-.55 2.92-1.27 4.86-2.11 5.83-2.51 2.78-1.16 3.35-1.36 3.73-1.36.08 0 .27.02.39.12.1.08.13.19.14.27-.01.06.01.24 0 .38z"/></svg>
        </span>
        <span class="action-text">تلگرام</span>

      <!-- ۴. ذخیره مخاطب -->
      <button type="button" onclick="downloadVCF()" class="action-item btn-vcf" title="ذخیره شماره در مخاطبین">
        <span class="action-icon">
          <svg viewBox="0 0 24 24"><path d="M19 14v5a2 2 0 01-2 2H7a2 2 0 01-2-2v-5M12 3v13m0 0l4-4m-4 4L8 12" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" fill="none"/></svg>
        </span>
        <span class="action-text">ذخیره</span>
      </button>

      <!-- ۵. اشتراک‌گذاری -->
      <button type="button" onclick="shareCard()" class="action-item btn-share" title="اشتراک‌گذاری کارت">
        <span class="action-icon">
          <svg viewBox="0 0 24 24"><path d="M18 16.08c-.76 0-1.44.3-1.96.77L8.91 12.7c.05-.23.09-.46.09-.7s-.04-.47-.09-.7l7.05-4.11c.54.5 1.25.81 2.04.81 1.66 0 3-1.34 3-3s-1.34-3-3-3-3 1.34-3 3c0 .24.04.47.09.7L8.04 9.81C7.5 9.31 6.79 9 6 9c-1.66 0-3 1.34-3 3s1.34 3 3 3c.79 0 1.5-.31 2.04-.81l7.12 4.16c-.05.21-.08.43-.08.65 0 1.61 1.31 2.92 2.92 2.92s2.92-1.31 2.92-2.92c0-1.61-1.31-2.92-2.92-2.92z"/></svg>

    </div>

    <div class="divider"></div>

    <!-- کارت‌های لینک و گیت‌هاب -->

      <a href="mailto:info@medlina.ir" class="link-card">

    <!-- فوتر -->

  <div id="toast" class="toast">پیام کپی شد!</div>

  <script>
    function showToast(msg) {
      const toast = document.getElementById('toast');
      toast.innerText = msg;
      toast.classList.add('show');
      setTimeout(() => toast.classList.remove('show'), 2500);
    }

    function downloadVCF() {
      const vcard = `BEGIN:VCARD
VERSION:3.0
N:اسداله‌پور;مهران;;;
FN:مهران اسداله‌پور
ORG:Medlina
TITLE:توسعه‌دهنده نرم‌افزار
TEL;TYPE=CELL:+989112520846
EMAIL:info@medlina.ir
URL:https://itmerti.github.io/digital-business-card/
END:VCARD`;

      const blob = new Blob([vcard], { type: 'text/vcard;charset=utf-8;' });
      const url = URL.createObjectURL(blob);
      const newLink = document.createElement('a');
      newLink.href = url;
      newLink.setAttribute('download', 'Mehran_Asadolahpour.vcf');
      document.body.appendChild(newLink);
      newLink.click();
      document.body.removeChild(newLink);
      showToast("مخاطب برای ذخیره در گوشی آماده شد ✅");
    }

    async function shareCard() {
      const shareData = {
        title: 'کارت ویزیت مهران اسداله‌پور',
        text: 'کارت ویزیت دیجیتال مهران اسداله‌پور | توسعه‌دهنده نرم‌افزار',
        url: window.location.href
      };

      if (navigator.share) {
        try {
          await navigator.share(shareData);
        } catch (err) {}
      } else {
        navigator.clipboard.writeText(window.location.href);
        showToast("لینک کارت کپی شد 📋");
      }
    }
  </script>
